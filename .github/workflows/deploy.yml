name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: useblacksmith/checkout@v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to the production stage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # GitHub Actions is non-interactive, so `--yes` is required for Alchemy
        # to apply the plan instead of waiting for approval.
        run: pnpm --filter @tic-tac-chor/infra exec alchemy deploy --stage production --yes
